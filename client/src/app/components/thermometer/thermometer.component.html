@if (popularity) {
  <div class="progress" role="progressbar" aria-label="Popularity"
    [attr.aria-valuenow]="popularity.percent * 100">
    <div class="progress-bar"
      [style.width]="popularity.percentageString"
      [style.background-color]="popularity.color">
      <span class="progress-bar-text">Popularity: {{popularity.percentageString}}</span>
    </div>
  </div>
}
