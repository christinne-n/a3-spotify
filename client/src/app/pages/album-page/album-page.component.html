@if(album) {
	<div class="row">
		<div class="col-12 col-sm-6">
			<h1>{{album.name}}</h1> <!-- album name to be displayed-->
			<img id="albumImg" class="img-fluid w-100" [src]="album.imageURL" [alt]="album.name">
			<app-thermometer [popularity]="album.popularity"></app-thermometer>
			@for (artist of album.artists; track artist.id) {
				<p>Artist: <a [href]="'/artist/' + artist.id">{{artist.name}}</a></p>
			}
			<p> <!--album link to spotify & album page-->
				<a class="btn btn-light" role="button" target="_blank" [href]="album.url">Open {{album.name}} on Spotify</a>
			</p>
		</div>
		<div class="col-12 col-sm-6"> <!-- display album tracklist-->
			<h3>Album Tracks</h3>
			<app-track-list [tracks]="tracks" [hideArtist]="true" [hideAlbum]="true"></app-track-list>
		</div>
	</div>
}
