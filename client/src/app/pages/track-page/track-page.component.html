<div class="row">
	@if(track) {
		<div class="col-sm-6 col-12">
			<h1>{{track.name}}</h1>
			<p>
				Track on <a [href]="'/album/' + track.album.id">{{track.album.name}}</a>
			</p>
			<div> <!-- loop over track artist and linking to artist + display artist-->
				@for (artist of track.artists; track artist.id) {
					<p>Artist: <a [href]="'/artist/' + artist.id">{{artist.name}}</a></p>
				}
			</div>
			<p>
				Duration: {{track.durationStr}}
			</p> <!-- track duration and linking to track on spotify-->
			<p>
				<a class="btn btn-light" role="button" target="_blank" [href]="track.url">Open {{track.name}} on Spotify</a>
			</p>
		</div>
		<div class="col-sm-6 col-12">
			<h3>Popularity</h3>
			<app-thermometer [popularity]="track.popularity"></app-thermometer> <!--thermometer component depending on popularity-->
		</div>
	}
</div>
