@if(artist) {
	<div class="row">
		<div class="col-xl-4 col-12">
			<h1>{{artist.name}}</h1>
			<img id="artistImg" class="img-fluid w-100" [src]="artist.imageURL" [alt]="artist.name">
			<p> <!-- add artist name and link to spotify after displaying result-->
				<a class="btn btn-light" role="button" target="_blank" [href]="artist.url">Open {{artist.name}} on Spotify</a>
			</p>
		</div>
		<div class="col-xl-4 col-12">
			<h3>Popularity</h3>
			<p>{{artist.followersStr}} followers</p> <!--the following code displays artists followers, albums as carousel and top tracks-->
			<app-thermometer [popularity]="artist.popularity"></app-thermometer>
			<h3>{{artist.name}}'s Albums</h3>
			<app-carousel [resources]="albums" carouselId="artistAlbums"></app-carousel>
		</div>
		<div class="col-xl-4 col-12">
			<h3>{{artist.name}}'s Top Tracks</h3>
			<app-track-list [tracks]="topTracks" [hideArtist]="true"></app-track-list>
		</div>
	</div>
}
